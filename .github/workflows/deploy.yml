# 私有仓库自动部署：用 Vercel Token 由 CI 发起部署，绕过 Vercel 对私有仓库的 git 作者校验
name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Link to Vercel project
        run: vercel link --yes --project-id "$VERCEL_PROJECT_ID" --org-id "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"

      - name: Deploy to production
        run: vercel deploy --prod --token "$VERCEL_TOKEN"
