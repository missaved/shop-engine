<?xml version="1.0" encoding="UTF-8"?>
<!--
  OG 图源文件 · 1200×630 · 纯矢量无外链字体（保证 sharp/libvips 渲染稳定）
  - 左 1/3 主色块 + 大定位针
  - 右 2/3 留白（文字由 og:title meta 承担，避免字体加载问题）
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <!-- 背景纸色 -->
  <rect width="1200" height="630" fill="#FAFAFA"/>

  <!-- 左侧主色块：占 1/3（400px 宽） -->
  <rect x="0" y="0" width="400" height="630" fill="#0EA5A4"/>

  <!-- 大定位针（居中于左侧色块） -->
  <g transform="translate(40 95) scale(1.6)">
    <!-- 重用 mark 路径，保持视觉一致 -->
    <svg viewBox="0 0 192 192" x="0" y="0" width="200" height="200">
      <path d="M 96 36 C 67 36 44 58 44 86 C 44 117 79 148 96 161 C 113 148 148 117 148 86 C 148 58 125 36 96 36 Z" fill="#FAFAFA"/>
      <circle cx="96" cy="86" r="20" fill="#0EA5A4"/>
      <circle cx="96" cy="86" r="11" fill="#FAFAFA"/>
    </svg>
  </g>

  <!-- 左侧底部小字（用通用字体，避免字体问题） -->
  <text x="40" y="560"
        font-family="Arial, Helvetica, sans-serif"
        font-size="28" font-weight="700"
        fill="#FAFAFA" letter-spacing="-0.5">SpotNear</text>
  <text x="40" y="595"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18" font-weight="400"
        fill="#CCFBF1" letter-spacing="0.3">spotnear.me</text>

  <!-- 右侧色块装饰：浅色 chip 提示"轻量 SaaS" -->
  <rect x="460" y="270" width="160" height="44" rx="22" fill="#CCFBF1"/>
  <text x="540" y="298"
        font-family="Arial, Helvetica, sans-serif"
        font-size="18" font-weight="600"
        fill="#0F766E" text-anchor="middle">Lightweight POS</text>

  <!-- 右侧三语小字（仅通用拉丁字符） -->
  <text x="460" y="360"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22" font-weight="400"
        fill="#71717A">For street shops in SEA</text>

  <!-- 装饰小圆点（3 个，对应三阶段） -->
  <circle cx="460" cy="500" r="8" fill="#0EA5A4"/>
  <circle cx="490" cy="500" r="8" fill="#0F766E"/>
  <circle cx="520" cy="500" r="8" fill="#FACC15"/>
</svg>